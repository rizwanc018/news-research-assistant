[project]
name = "news-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rizwanc018", email = "rizwanc018@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.16",
    "ipykernel>=7.4.0",
    "lancedb>=0.41.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
news-research = "news_research.main:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
